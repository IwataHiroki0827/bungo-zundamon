  - id: Q-009
    type: question
    status: closed
    title: F001 リリース候補の外部・手動QT完了確認
    body: >-
      候補commit 5337d2752e5a288b8d3078c2d1d133ebdef6ed21、catalog SHA-256
      5125e1c788adf95d247eae6c072e2afe010937b9af78cb292effbdf31649f1c1
      を対象とします。GitHub・Chrome・Edge・規約確認はCodexが完了済みです。iOS
      Safariの「証跡メモ（必須）」だけ、「端末名／iOS版／Safari版／縦表示／横表示／再生・一時停止・再開・停止・先頭再生／外部通信／画像または動画の保存先」を記入してください。「OK」だけでは試験証跡として受理できません。
