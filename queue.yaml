    checks:
      - id: visibility_preapproval
        label: 承認前repository・Pages状態
        required: true
        require_note: true
        url: https://github.com/IwataHiroki0827/bungo-zundamon/settings/pages
        preconditions: >-
          管理権限でGitHubへ認証し、候補SHA 5337d2752e5a288b8d3078c2d1d133ebdef6ed21
          とcatalog hash
          5125e1c788adf95d247eae6c072e2afe010937b9af78cb292effbdf31649f1c1
          を確認する。
        steps:
          - repositoryのVisibilityがPrivateであることを確認する。
          - Pagesが無効であることを確認する。
          - >-
            Actions
