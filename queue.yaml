  - id: Q-048
    type: approval
    status: closed
    title: 規約再確認期限の実行時fail-closedをリリースゲートへ移す要求変更
    body: >-
      `content/licenses.json`の`terms.validUntil`は規約側が定めた期限ではなく、
      プロジェクトが自ら置いた再確認リマインダーである。現状は`renderCreditsV2`が `validUntil <
      Date.now()`で`CREDITS_POLICY_STALE`を投げるため、期限を過ぎた瞬間に
      公開済みバンドルが自壊し、訪問者のブラウザでクレジットページが表示されなくなる。
      規約違反が生じたわけでもなく、こちらの事務的な日付だけでサイトが壊れる点で
      影響が釣り合っていない。判定時刻がクライアント依存である点も不安定である。
      再確認義務自体は非公式ファンサイトとして妥当であり、REQ-F005-005も選定時・
      公開直前の権利再確認を求めているため維持する。期限切れの効果を 「公開サイトを止める」から「新規リリースを止める」へ移す。
    target: docs/design/DD-F002.md
    target_mode: document
    options:
      - 実行時判定をリリースゲートへ移す
      - 実行時判定を維持したまま日付だけ更新する
      - 期限の概念そのものを廃止する
