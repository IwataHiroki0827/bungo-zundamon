    answer: 実行時判定をリリースゲートへ移す
    answer_note: オーナーが「その確認いらんやん」と指摘し、実行時fail-closedの不当性を確認。 再確認義務は残し、効果の置き場所だけを変える方針で合意した
    resolution: CHG-F002-004でFUN-F002-025の実行時期限判定を外しリリース前チェックへ移す
