- id: T-074
  title: F005 UT・IT・QT・6環境・権利・容量・セキュリティ受入を実施
  feature: F005
  phase: test
  state: done
  depends:
  - T-073
  tags: *id005
  mode: orchestration
  mode_reason: ロジック、結合、6ブラウザ環境、権利、容量、securityの独立試験を並列実行できるため
  model:
    lead: opus
    workers: sonnet
  progress: >-
    F004先例（commit 05ba5cd）を調査し、`scripts/f004-final-integration.ts --retain`が
    `buildPagesPreview`でofflineのdist候補を生成し、`PLAYWRIGHT_DIST_ROOT`環境変数で
    Playwright（`usePrebuiltDist`）へ接続する運用と判明した（candidate branchのpush/commitは
    しない）。同じ`--retain`機構がF005側の`scripts/f005-final-integration.ts`に存在しなかったため
    追加した（dist生成・candidate-paths.json永続化、commit 9adb6a1、typecheck/lint PASS）。
    Vitestは`npm test`で1304 passed/8 failed、8件は個別再実行で全PASSしWindows並列実行時の
    resource contentionと確認済み（T-073と同型の既知flaky）。
    `--retain`でF005候補dist（authors=4/works=15/dialogues=877/audioAssets=861、
    901 dist files、contentBuildSha256=9bdb97a6…、distSha256=c92a735c…、
    sourceCommit=9adb6a16…）を`.cache/f005-final-integration-s4y5MI/`へ生成し、
    `PLAYWRIGHT_DIST_ROOT`でPlaywright 6プロジェクト設定へ接続してtest:e2eを実行した。
    実行結果は144件中ほぼ全件が「作品を読み込めませんでした」（catalog起動時読込失敗）で
    タイムアウト・失敗した。個別に`page.on('requestfailed')`で追跡した結果、
    `content/catalog.json`へのfetchがHTTP 200を受信した直後に`net::ERR_ABORTED`で
    ボディ読取が中断されるという再現するネットワークレベルの挙動を確認した。
    重要な追加検証: 同じ症状は、F005を一切含まない現行mainベースの委commit済み`public/`
    （`npm run build`のみ、F005 candidate不使用）をpreview配信した場合にも**同一に再現した**。
    よってこの「起動時ロード失敗」はF005候補固有の回帰ではなく、本セッションの実行環境
    （このWindowsマシン上のPlaywright/Chromiumの現在の状態、Cドライブ空き42GB・96%使用、
    レガシーな多数の待機node/chromeプロセスが並行して残存）側の問題である可能性が高い。
    ただしF004のQT実施（2026-07-29、Actions run 30390224028等のhosted）以降、
    このローカル環境で再現性のあるE2E成功実績がない状態でこの結論に至ったため、断定はできない。
    上記と並行して、QT-F005/UT-F005/IT-F005の20/48/15ケースについて、F003/F004が備える
    `f003-spec-coverage.test.ts`/`f004-spec-coverage.test.ts`相当の機械照合ファイルが
    F005には存在しないことを確認した。手動でID→test file対応を洗い出した結果、
    UT-F005は48件中12件（014, 023, 033-039, 042, 044, 046）、IT-F005は15件中8件
    （001-003, 010-014）が、テストファイル中に該当IDの記載が一切なく対応関係を確認できない
    （実装コード上も同様に該当タグなし）。特にUT-F005-014/FUN-F005-014
    （`extractVerifiedShumiNotice`、趣味の遺伝の公式表現注意notice）は設計書
    （DD-F005.md）に定義があるが実装が存在せず、`src/content/f005-catalog.ts`の
    `projectF005Credits`/`DataDrivenWorkNoticeV1`という関連機構は実装・単体テスト
    （fixture経由）されているものの、`scripts/f005-final-integration.ts`の実プロダクション
    経路からは一度も呼び出されておらず、現候補のCatalogには趣味の遺伝の公式notice記載が
    欠落している（QT-F005-006に抵触する可能性）。また`tests/e2e/`配下にF005固有の
    REQ/QT-F005タグを持つspecファイルが1件も存在しない（既存4本のspecはF001〜F004時代の
    汎用specであり、F005データを偶発的に流用するのみ）。これらは設計判断（notice配線方法、
    E2E spec追加方針）を要するため実装せず報告に留めた。T-074は`done`にできず`doing`で継続する。
    追加調査（CHG-F005-080）: E2E全滅の原因を特定した。`curl`/node native fetchで
    `content/catalog.json`を直接取得すると200・全量正常取得でき、生HTTPレベルは問題なし。
    Playwright単体specで再現させ、失敗traceの`0-trace.network`を確認したところ
    `content/catalog.json`のresponseにのみ`"_failureText":"net::ERR_ABORTED"`が記録されていた
    （同時に取得する`licenses.json`/`artwork-provenance.json`は正常完了）。
    `src/main.ts`の`startBungoZundamon`は`catalogLoader`と`noticeLoader`を共有の
    `AbortController`で`Promise.all`しており、どちらかがrejectすると
    もう一方のin-flight fetchも`abort.abort()`で巻き込まれてキャンセルされる実装だった。
    `src/notices/release-notices.ts`の`validateReleaseNotices`は
    `content/licenses.json`の`terms.validUntil`（2026-08-18T07:25:00Z）と実行時の実時計を比較し、
    超過していれば`terms-expired`で検証失敗する。本セッションの実時計は2026-08-20〜21で
    この期限を2〜3日超過していたため、noticeLoaderが例外を投げてcatalog.jsonのfetchも
    巻き込まれてabortされ、「作品を読み込めませんでした」画面になっていた。
    Playwrightの`page.clock.install`で有効期間内時刻（2026-08-10）に固定して同一distへ
    アクセスしたところ正常に読み込めることを確認し、上記仮説を実証した。
    結論: F005候補・環境固有の問題ではなく、`content/licenses.json`の権利確認有効期限切れという
    安全装置の作動である。`terms.checkedAt`/`terms.validUntil`の更新は実際の規約再確認を
    伴わない限り行うべきでないため未修正。さらに`queue.yaml`Q-049/Q-050を確認したところ、
    この期限判定は既にCHG-F002-005（Q-049承認）で廃止決定済みであり、mainはPR #3
    （commit 957855c、v0.4.1として本番デプロイ済み）で`src/notices/release-notices.ts`から
    `terms-expired`系issueを削除済みだった。feature/F005ブランチ自身のcommit 8c0e320は
    `src/notices/credits.ts`のみ修正し`release-notices.ts`を未反映のまま残していたことが
    `git diff origin/main -- src/notices/release-notices.ts`で確認できた（Q-050の
    processed_noteが事前に警告していた「軽微なコンフリクト」相当）。よって次アクションは
    設計判断ではなく、mainの当該ファイルをfeature/F005へ反映するだけで解消する見込み。
    詳細はCHG-F005-080参照。
    追加実装: 上記で欠落確認したFUN-F005-014（UT-F005-014）`extractVerifiedShumiNotice`を
    `src/content/f005-source.ts`に実装した。公式card raw（`data/batches/F005/source-snapshots/
    selection/works/001104/card.html`）内の唯一trusted「備考」`<tr>`構造だけを正規表現で許可し、
    text/source URL/raw SHA/notice SHAを独立に再計算して自己申告candidate
    （新規`content/batches/F005/work-artifacts/001104/shumi-notice-candidate.json`、
    実card raw sha256=5c5c1228…856201から検算した値で作成）と照合する。HTML注入・欠落・
