    test.tsのvite pluginTimings stderr出力・published-baseline.test.tsの並列
    実行下timeout、いずれも個別実行でPASS確認済み・既存の既知flaky）。
    T-152（名人伝）・T-153（弟子）は、段階A/B1（抽出・二重判定・音声生成・
    forecast）を本タスクと同一パターンで反復したうえで、本セッションで確立した
