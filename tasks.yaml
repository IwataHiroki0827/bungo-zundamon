    backward-compat検証をbuild時点で完結させているため、acceptance側での
    重複検証は設計上不要と判断した。真の障害は別にあった：F006のvoiced
    stage record（scripts/f006-prepare-voice.ts）は間接ハッシュ規約
    （voiceEvidenceRefファイルのSHA-256を1件だけ格納）を採用しているが、
    汎用promoteVerifiedWorkArtifactsのassertInputsはvoiced stageの
    outputHashesへgenerationDigest/completenessDigestを直接含むことを要求し、
    かつtransitionWorkState（batch.ts）は同一work statusへの再遷移
    （同一rankへのstage record追記）を許さないため、既存voiced recordを
    後から直接ハッシュへ書き換えることができなかった。解決として新規
    scripts/f006-capacity-actual.tsが、batch-runtime.tsのappendActualEvidence
    （F002固有）と同型の直接manifest操作パターン（validateBatchManifest→
    writeBatchManifestAtomic、transitionWorkStateを経由しない）で、
    (1)間接ハッシュから再導出した直接generationDigest/completenessDigestを
    outputHashesに持つ2件目のvoiced stage record（work statusはvoicedのまま）
    を追記し、(2)続けてF001 baseline invariant（baseline.tsのverifyF001Invariant/
    verifyF001DistInvariant、feature非依存）・Pages dist previewの実vite build
    （pages-preview.tsのbuildPagesPreview）・容量actual（voice/budget.tsの
    verifyActualCapacity、既存forecastの測定値をdisk入力へ再利用）を実行し、
    その結果を直接ハッシュで参照するcapacity-actual stage recordを追記する
    （batch.tsのvalidateWorkProgressが定める「voiced直後のcapacity-actual
    1件だけ許容」特例に適合）。この2段階書込みにより、以降src/content/
    f006-acceptance.ts（F004のf004-acceptance.tsと同型、prepare関数が
    canonical allowlist pathから実体を再読込・再検証してbranded prepared値を
    mintし、既存promoteVerifiedWorkArtifacts・writeBatchManifestAtomicを
    無変更のまま呼ぶ薄い橋渡し層）がassertInputsを満たせるようになった。
    scripts/f006-accept-work.ts（CLI entrypoint）から実行し、山月記(000624)を
    voiced→accepted（batch.jsonのwork status、stageRecords 7件へ拡張）まで
    実際に遷移させ、生成WAV 3件（計404,100 bytes）を.voice-stage-000624/から
    content/batches/F006/accepted-audio/000624/へ正式昇格した（batch全体
    statusはdraft維持、他2作品がpendingのため既存batchStatusFromWorksの
