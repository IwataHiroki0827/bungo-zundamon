  completed_at: '2026-08-23T00:00:00+09:00'
  result: audioIdは内容hashのため、既存(v070まで)audioAssetsと重複するIDは
    provably同一内容(同一sha256/bytes/durationMs)であり、既存の公開済み
    ファイル(audio/F005/{audioId}.wav)を再利用すれば再生に一切影響しない。
    scripts/f008-content-preview.ts(F008ローカル、共有モジュール無変更)へ、
    (1) currentFragment.audioAssetsの構築時にv070.catalog.audioAssetsへ
    既存のIDをfilterで除外、(2) 物理file staging(activeStage配下への
    copyFile)でも同じIDを同じ条件でskip、の2箇所を修正した。除外された
    dialogueのaudioId参照自体は変更せず、既存(F005)の同一内容ファイルを
    そのまま指す。F009・F010でも同様の偶然一致が起こり得るため、
    f00N-content-preview.tsを複製する際はこの重複排除ロジックを踏襲する
    ことを推奨する。

    【訂正・最終方式】上記のfragment側除外方式は、その後のfinal-integration
    実行でPUBLIC_REFERENCE_MISSING（accepted-audioの実ファイルがcatalogから
    参照されない）を新たに引き起こすことが判明し撤回した。各batchの
    accepted-audio配下の実ファイルは必ずそのbatch自身のcatalog audioAssets
    entryから参照される必要がある（src/content/batch-public.ts、共有・
    要件として維持）という既存不変条件と、audioId(内容hash)のcatalog全体
    一意性という別の既存チェックが、真の内容衝突ケースでは両立し得ない
    設計だったため、後者(グローバル一意性チェック)側を「path(batch scoped)
    が異なり実体(sha256/bytes/durationMs/configHash)が完全一致する場合は
    正当な独立entryとして許容し、path衝突や実体不一致(hash衝突等)のみ
    引き続き拒否する」形へ緩和する方式に変更した。対象:
    src/content/batch-public.ts(catalogFor、共有)・
    src/content/f008-catalog.ts(mergeNewAuthorCatalog008、F008ローカル)。
    scripts/f008-content-preview.ts・scripts/f008-final-integration.tsの
    除外ロジックは撤回し元の実装(各batchが自分のaudioAssetsをそのまま
    登録)へ戻した。batch-public.test.ts(19件)・f008-catalog.test.ts
    (12件)・f003-catalog.test.ts等関連5ファイル(35件)にregressionなし。

    【再訂正・最終方式】上記の「path相違+実体一致」条件も、実データでの
    再現テストにより不十分と判明した。debug printで実際の衝突entryを
    確認したところ、F008側(sha256=c1d1c9d8...)とF005側(sha256=c8efe370...)
    でWAV実体のsha256が異なっていた(bytes=34860・durationMs=725・
    configHashは完全一致)。audioId(createVoiceCacheKeyV2、src/voice/cache.ts)
    はtext+config"入力"のhashであり出力音声自体のhashではないため、
    異なるセッションで独立に生成したVOICEVOX合成は同一入力でも実体
    (sha256)が一致するとは限らないと実測で判明した(想定と異なる新知見)。
    実体一致を条件にする方式では本件を弾いてしまうため、最終的に
    「path(batchId scopedで既に一意な名前空間)の衝突だけを実エラーとして
    拒否し、audioId(入力hashに過ぎない)の一致自体は許容する」方式へ
    再修正した。対象は同じ2ファイル(src/content/batch-public.ts・
    src/content/f008-catalog.ts)。再検証: batch-public.test.ts・
    f008-catalog.test.ts・f003-catalog.test.ts等関連7ファイル(66件)に
    regressionなし、tsc/lint clean。

    【最終決定】build-time検証の緩和による解決を全面撤回し、根本原因を
    再調査した結果、src/ui/render.ts(実際のUI描画ロジック、共有)が
    「1 audioIdにつきasset厳密に1件、かつそのbatchIdがwork.batchIdと
    一致すること」というハード不変条件(assets?.length !== 1 ||
    assets[0].batchId !== work.batchIdでUIRenderErrorを投げる)を持つ
    ことを発見した。これはbuild-time側を何層緩和してもrender時に
    確実にクラッシュする、緩和不可能な設計制約だった。また既存の
    audioAliases機構(src/content/batch-public.tsのnormalizeBatchAudio)は
    同一batch内でのsha256一致dedupのみを想定しており、batch跨ぎの
    audioId一致には使えない設計であることも確認した。

    正しい解決は、この1候補(一人二役057193「へええ」、candidateId
    6U_FZHeFuXXDsFhoZR_tL-rGzSiPDAqsLMdxMK0hCLA)をF008の公開対象から
    除外することとした。編集レビューでは実際に発話として承認済み
    (SPOKEN_DIALOGUE)であり内容上の却下ではないため、既存schemaの
    candidateCounts.audioExcluded/audioFailureReasons(F002〜F007では
    常に0/{}のまま未実使用だった、まさにこのユースケース向けと見られる
    フィールド)を実際に使用する初のケースとした:
    - scripts/f008-reset-057193-to-reviewed.ts(新規): work状態遷移は
      forward-onlyのため、057193をaccepted→reviewedへ直接書き換えで
      巻き戻し、voiced以降の派生artifact(accepted-audio・capacity-actual・
      voice-evidence・voice-generation/completeness・staging)を削除する。
    - content/batches/F008/work-artifacts/057193/speech-revisions.json:
      該当candidateを除外(11→10件)。candidates.json・reviews/057193.json・
      review-reconciliation.json(編集レビューの実記録)は変更していない
      (この候補は編集上approvedのまま、音声段階でのみ除外するため)。
    - scripts/f008-content-preview.ts・scripts/f008-final-integration.ts:
      computeExclusionCounts()を新設し、reviews[].status!=='approved'
      (編集却下)とapproved-but-not-in-speech-revisions(音声段階除外)を
      正しく区別してcandidateCounts.editorialExcluded/editorialReasonsと
