name: F005 hosted native probe

on:
  push:
    branches:
      - feature/F005
    paths:
      - .github/workflows/f005-hosted-native-probe.yml
      - native/f005-guard/**
      - native/f005-guard-tests/**
      - src/content/f005-source.ts

permissions:
  actions: read
  contents: read

concurrency:
  group: f005-hosted-native-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned production and target assemblies
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $selectorPath = 'native/f005-guard-tests/hosted-target-selector.json'
          $selector = Get-Content -Raw -LiteralPath $selectorPath | ConvertFrom-Json
          if ($selector.schemaVersion -cne '1.0.0' -or
              $selector.selectedTargetId -cne 'CHG-F005-070/T-142' -or
              $selector.kind -cne 'f005-t142-hosted-correlation' -or
              $selector.manifestPath -cne 'native/f005-guard-tests/t142-case-manifest.json' -or
              $selector.testSourcePath -cne 'native/f005-guard-tests/T142TargetSuite.cs' -or
              $selector.caseMarkerPrefix -cne 'F005_T142_CASE_BASE64=' -or
              $selector.resultMarkerPrefix -cne 'F005_T142_RESULT_BASE64=') {
            throw 'F005_T142_SELECTOR_INVALID'
          }
          $tracked = @('public', 'data', 'candidate', 'audio', 'staging')
          if (@(git status --porcelain=v1 -- $tracked).Count -ne 0) {
            throw 'F005_T142_TRACKED_BASELINE_CHANGED'
          }
          $nativeOutput = & pwsh -NoLogo -NoProfile -File native/f005-guard/build.ps1 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'F005_T142_NATIVE_BUILD_FAILED'
          }
          $dotnet = Join-Path $PWD '.cache\dotnet-f005\sdk\dotnet.exe'
          $testOutput = & $dotnet build `
            native/f005-guard-tests/F005Guard.CorrelationTests.csproj `
            --configuration Release --nologo 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'F005_T142_TARGET_BUILD_FAILED'
          }
          $guard = Join-Path $PWD '.cache\dotnet-f005\publish\f005-guard.exe'
          $target = Join-Path $PWD `
            'native\f005-guard-tests\bin\Release\net9.0\win-x64\F005Guard.CorrelationTests.exe'
          if (!(Test-Path -LiteralPath $guard) -or !(Test-Path -LiteralPath $target)) {
            throw 'F005_T142_BUILD_OUTPUT_MISSING'
          }
          "guard_path=$guard" >> $env:GITHUB_OUTPUT
          "target_path=$target" >> $env:GITHUB_OUTPUT
          "native_binary_sha256=$((Get-FileHash -LiteralPath $guard -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "target_id=$($selector.selectedTargetId)" >> $env:GITHUB_OUTPUT
          "target_kind=$($selector.kind)" >> $env:GITHUB_OUTPUT
          "manifest_path=$($selector.manifestPath)" >> $env:GITHUB_OUTPUT
          "test_source_path=$($selector.testSourcePath)" >> $env:GITHUB_OUTPUT
          "case_marker_prefix=$($selector.caseMarkerPrefix)" >> $env:GITHUB_OUTPUT
          "result_marker_prefix=$($selector.resultMarkerPrefix)" >> $env:GITHUB_OUTPUT

      - name: Verify kernel ETW preflight
        id: kernel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = '{"op":"capacity-preflight"}' | & '${{ steps.build.outputs.guard_path }}' 2>&1
          $exitCode = $LASTEXITCODE
          try { $reply = $raw | ConvertFrom-Json }
          catch { throw 'F005_T142_KERNEL_PREFLIGHT_REPLY_INVALID' }
          if ($exitCode -ne 0 -or $reply.ok -ne $true) {
            throw 'F005_T142_KERNEL_PREFLIGHT_BLOCKED'
          }
          'result=pass' >> $env:GITHUB_OUTPUT

      - name: Run selected isolated native target suite
        id: target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP `
            "f005-target-stdout-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          $stderr = Join-Path $env:RUNNER_TEMP `
            "f005-target-stderr-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          $process = Start-Process `
            -FilePath '${{ steps.build.outputs.target_path }}' `
            -ArgumentList @('--target', '${{ steps.build.outputs.target_id }}') `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -NoNewWindow -Wait -PassThru
          if ((Get-Item -LiteralPath $stdout).Length -gt 65536 -or
              (Get-Item -LiteralPath $stderr).Length -gt 65536) {
            throw 'F005_T142_TARGET_OUTPUT_LIMIT'
          }
          if ($process.ExitCode -ne 0) {
            throw 'F005_T142_TARGET_EXIT_NONZERO'
          }
          if ((Get-Item -LiteralPath $stderr).Length -ne 0) {
            throw 'F005_T142_TARGET_STDERR_PRESENT'
          }
          $casePrefix = '${{ steps.build.outputs.case_marker_prefix }}'
          $resultPrefix = '${{ steps.build.outputs.result_marker_prefix }}'
          $casePayloads = [Collections.Generic.List[string]]::new()
          $resultPayloads = [Collections.Generic.List[string]]::new()
          foreach ($line in @(Get-Content -LiteralPath $stdout -Encoding utf8)) {
            if ($line.StartsWith($casePrefix, [StringComparison]::Ordinal)) {
              $casePayloads.Add($line.Substring($casePrefix.Length))
            } elseif ($line.StartsWith($resultPrefix, [StringComparison]::Ordinal)) {
              $resultPayloads.Add($line.Substring($resultPrefix.Length))
            } else {
              throw 'F005_T142_TARGET_UNKNOWN_LINE'
            }
          }
          if ($resultPayloads.Count -ne 1) {
            throw 'F005_T142_TARGET_RESULT_CARDINALITY'
          }
          $manifestPath = '${{ steps.build.outputs.manifest_path }}'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.targetId -cne '${{ steps.build.outputs.target_id }}' -or
              $casePayloads.Count -ne $manifest.cases.Count) {
            throw 'F005_T142_TARGET_CASE_CARDINALITY'
          }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          for ($index = 0; $index -lt $casePayloads.Count; $index++) {
            try {
              $case = [Text.Encoding]::UTF8.GetString(
                [Convert]::FromBase64String($casePayloads[$index])) | ConvertFrom-Json
            } catch { throw 'F005_T142_TARGET_CASE_MARKER_INVALID' }
            if ($case.caseId -cne $manifest.cases[$index] -or
                $case.result -cne 'pass' -or !$seen.Add([string]$case.caseId)) {
              throw 'F005_T142_TARGET_CASE_MISMATCH'
            }
          }
          try {
            $result = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($resultPayloads[0])) | ConvertFrom-Json
          } catch { throw 'F005_T142_TARGET_RESULT_MARKER_INVALID' }
          $manifestSha = (Get-FileHash -LiteralPath $manifestPath `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($result.targetId -cne '${{ steps.build.outputs.target_id }}' -or
              $result.result -cne 'pass' -or
              $result.expectedCaseCount -ne $manifest.cases.Count -or
              $result.passedCaseCount -ne $manifest.cases.Count -or
              $result.caseManifestSha256 -cne $manifestSha) {
            throw 'F005_T142_TARGET_RESULT_MISMATCH'
          }
          "result_base64=$($resultPayloads[0])" >> $env:GITHUB_OUTPUT
          "case_count=$($manifest.cases.Count)" >> $env:GITHUB_OUTPUT

      - name: Correlate read-only evidence with Pages
        shell: pwsh
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
          TARGET_RESULT_BASE64: ${{ steps.target.outputs.result_base64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_READ_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?event=push&head_sha=$env:GITHUB_SHA&per_page=20"
          $pagesRun = $null
          for ($poll = 0; $poll -lt 40; $poll++) {
            $response = Invoke-RestMethod -Headers $headers -Uri $runsUri
            $matches = @($response.workflow_runs | Where-Object {
              $_.head_sha -ceq $env:GITHUB_SHA -and $_.event -ceq 'push'
            })
            if ($matches.Count -gt 1) {
              throw 'F005_T142_PAGES_RUN_AMBIGUOUS'
            }
            if ($matches.Count -eq 1 -and $matches[0].status -ceq 'completed') {
              $pagesRun = $matches[0]
              break
            }
            Start-Sleep -Seconds 15
          }
          if ($null -eq $pagesRun -or $pagesRun.head_sha -cne $env:GITHUB_SHA) {
            throw 'F005_T142_PAGES_RUN_TIMEOUT'
          }
          $jobsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($pagesRun.id)/attempts/$($pagesRun.run_attempt)/jobs?per_page=100"
          $jobs = Invoke-RestMethod -Headers $headers -Uri $jobsUri
          $deploy = @($jobs.jobs | Where-Object { $_.name -ceq 'deploy' })
          if ($deploy.Count -ne 1 -or $deploy[0].conclusion -cne 'skipped') {
            throw 'F005_T142_PAGES_DEPLOY_NOT_SKIPPED'
          }

          $tracked = @('public', 'data', 'candidate', 'audio', 'staging')
          if (@(git status --porcelain=v1 -- $tracked).Count -ne 0) {
            throw 'F005_T142_TRACKED_OUTPUT_CHANGED'
          }
          $candidateBranch = "refs/heads/candidate/f005-t070-$env:GITHUB_SHA"
          if (@(git ls-remote --heads origin $candidateBranch).Count -ne 0) {
            throw 'F005_T142_CANDIDATE_BRANCH_PRESENT'
          }

          try {
            $target = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($env:TARGET_RESULT_BASE64)) |
                ConvertFrom-Json
          } catch { throw 'F005_T142_TARGET_RESULT_TRANSFER_INVALID' }
          $selectorPath = 'native/f005-guard-tests/hosted-target-selector.json'
          $selector = Get-Content -Raw -LiteralPath $selectorPath | ConvertFrom-Json
          $hashes = [ordered]@{}
          foreach ($item in ([ordered]@{
            program = 'native/f005-guard/Program.cs'
            productionProject = 'native/f005-guard/F005Guard.csproj'
            buildScript = 'native/f005-guard/build.ps1'
            globalJson = 'native/f005-guard/global.json'
            workflow = '.github/workflows/f005-hosted-native-probe.yml'
            testProject = 'native/f005-guard-tests/F005Guard.CorrelationTests.csproj'
            testSource = $selector.testSourcePath
            testHarness = 'native/f005-guard-tests/Program.cs'
            selector = $selectorPath
            caseManifest = $selector.manifestPath
          }).GetEnumerator()) {
            $hashes[$item.Key] = (Get-FileHash -LiteralPath $item.Value `
              -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $windowsVersion = Get-ItemProperty `
            'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $evidence = [ordered]@{
            schemaVersion = '1.0.0'
            kind = '${{ steps.build.outputs.target_kind }}'
            targetId = '${{ steps.build.outputs.target_id }}'
            sourceCommit = $env:GITHUB_SHA
            workflowRunId = [long]$env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            imageOs = $env:ImageOS
            imageVersion = $env:ImageVersion
            windowsBuild = [string]$windowsVersion.CurrentBuildNumber
            windowsUbr = [int]$windowsVersion.UBR
            powerShellVersion = $PSVersionTable.PSVersion.ToString()
            sourceSha256 = $hashes
            nativeBinarySha256 = '${{ steps.build.outputs.native_binary_sha256 }}'
            productionAssemblySha256 = $target.runtime.ProductionAssemblySha256
            productionAssemblyMvid = $target.runtime.ProductionAssemblyMvid
            testAssemblySha256 = $target.runtime.TestAssemblySha256
            testAssemblyMvid = $target.runtime.TestAssemblyMvid
            testExecutableSha256 = $target.runtime.TestExecutableSha256
            dotnetSdk = '9.0.316'
            dotnetRuntime = $target.runtime.DotnetRuntime
            kernelEtwPreflight = '${{ steps.kernel.outputs.result }}'
            caseManifestSha256 = $target.caseManifestSha256
            expectedCaseCount = [int]$target.expectedCaseCount
            passedCaseCount = [int]$target.passedCaseCount
            pagesRunId = [long]$pagesRun.id
            pagesRunAttempt = [int]$pagesRun.run_attempt
            pagesConclusion = [string]$pagesRun.conclusion
            pagesDeployConclusion = [string]$deploy[0].conclusion
            result = 'pass'
          }
          $json = $evidence | ConvertTo-Json -Depth 5 -Compress
          $marker = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          Write-Output "F005_T142_EVIDENCE_BASE64=$marker"
          @(
            '## F005 T-142 hosted correlation'
            ''
            "- target: ``$($evidence.targetId)``"
            "- result: ``$($evidence.result)``"
            "- cases: ``$($evidence.passedCaseCount)/$($evidence.expectedCaseCount)``"
            "- manifest SHA-256: ``$($evidence.caseManifestSha256)``"
            "- Pages run: ``$($evidence.pagesRunId)`` (deploy ``skipped``)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
