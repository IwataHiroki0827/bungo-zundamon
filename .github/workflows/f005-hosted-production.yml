name: F005 hosted production candidate

# Native tooling stays outside; T-109/T-110/T-112/T-122 deterministic correlations are complete. Retry after event-FO diagnostic.
# This self-path verifies the CHG-F005-072 postcondition contract with tagged acceptance codes.
on:
  push:
    branches:
      - feature/F005
    paths:
      - .github/workflows/f005-hosted-production.yml

permissions:
  contents: read

concurrency:
  group: f005-hosted-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  produce-candidate:
    if: github.repository == 'IwataHiroki0827/bungo-zundamon' && github.ref == 'refs/heads/feature/F005'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      F005_WRITE_COMPLETION_DRAIN_FAILURE_PATTERN: '^F005_ETW_WRITE_COMPLETION_DRAIN_(?:PREPARE_TUPLE_MISMATCH|PROCESS_(?:IDENTITY_FAILED|WAIT_FAILED|TUPLE_MISMATCH|SIGNALED|OUTSIDE_JOB)|JOB_QUERY_FAILED|EVENT_(?:TUPLE_(?:MISMATCH|LOOKUP_(?:EPOCH_EMPTY_(?:NO_LATE_PROOF|AT_OR_BEFORE_RESERVATION_ALL|POST_UPPER_PROOF_(?:MISSING_ALL|LEDGER_UNAVAILABLE_ALL|CURRENT_FILE_OBJECT_MISMATCH_ALL|CURRENT_BINDING_(?:MISMATCH_ALL|ENTRY_MISSING_ALL|GENERATION_MISMATCH_ALL|IDENTITY_MISMATCH_ALL|PATH_MISMATCH_ALL|STATE_NOT_BOUND(?:_OR_RETIRED)?_ALL|MIXED)|PARENT_(?:NOT_UNBOUND_ALL|BOUND_ALL|BOUND_ACTIVE_LEASE_(?:WRITE_ALL|SETINFO_ALL|BINDING_MISMATCH_ALL)|BOUND_(?:CONTEXT_MISSING|TUPLE_INVALID|PHASE_MISMATCH|PARENT_MISMATCH|RESERVATION_ORDER|EVENT_FO_(?:MISMATCH|ENTRY_MISSING_OR_UNBOUND|BOUND_SAME_PATH|BOUND_OTHER_PATH|RETIRED_SAME_PATH|RETIRED_OTHER_PATH|OTHER_STATE|LOOKUP_INVALID|OTHER_EVENT_DIR|OTHER_CANDIDATE_CURRENT|OTHER_CANDIDATE_PARENT|OTHER_SAME_PARENT_FILE|OTHER_DIFFERENT_PARENT|OTHER_RELATION_INVALID|DIR_(?:REUSED|DELETE_SEEN|CLEANUP_SEEN|LIVE|STATE_INVALID))|LEDGER_MISSING)|RETIRED_ALL|OTHER_STATE_ALL|STATE_MIXED)|MIXED)|TIME_PROOF_MIXED)|EXACT_(?:MISSING|AMBIGUOUS))|RECHECK_(?:SEAL_(?:MISSING|AMBIGUOUS)|FIELDS))|IDENTITY_FAILED)|BUFFER_LIMIT|FAILED|TIMEOUT|STATE_CHANGED|DIRECTORY_IDENTITY_MISMATCH|CURRENT_IDENTITY_MISMATCH|BINDING_MISMATCH|RECHECK_PROCESS_(?:IDENTITY_FAILED|WAIT_FAILED|TUPLE_MISMATCH|NOT_SIGNALED)|LATE_EVENT_AFTER_SEAL|LATE_RETAINED_PARENT_OTHER_ACTIVE_SAME_PARENT_POST_RESERVATION_(?:WRITE|SETINFO)|COMPLETED_NO_LEASE_DIRECTORY_HANDOFF_(?:CANDIDATE_AMBIGUOUS|IDENTITY_MATCH_(?:NONE|AMBIGUOUS))|ACTIVE_DIRECTORY_HANDOFF_(?:CANDIDATE_AMBIGUOUS|ELIGIBLE_(?:EXACT_ONE|AMBIGUOUS|ALL|MIXED))|LATE_DIAG_(?:(?:WRITE|SETINFO)_(?:SEAL_NOT_COMPLETED_RETAINED|CURRENT_PATH|ACTIVE_LEASE_MISSING|ACTIVE_PARENT_MISMATCH|AT_OR_BEFORE_ACTIVE_RESERVATION|MIXED_CAUSES)|WRITE_(?:ACTIVE_PRODUCER_(?:RECORD_MISSING|TUPLE_MISMATCH|RESERVATION_BIRTH_(?:RECORD_MISSING|TUPLE_MISMATCH)|RESERVATION_STATE_(?:ACTIVE_PHASE_CHANGED|CURRENT_BEFORE_INITIAL)|AT_OR_BEFORE_RESERVATION_BIRTH|AFTER_RESERVATION_BIRTH(?:_(?:AT_OR_BEFORE_INITIAL|AFTER_INITIAL_TO_CURRENT))?)|AT_OR_BEFORE_ACTIVE_PRODUCER_BIRTH|AFTER_ACTIVE_PRODUCER_BIRTH)))$'
      F005_WRITE_LEASE_PRODUCER_BIRTH_FAILURE_PATTERN: '^F005_WRITE_LEASE_PRODUCER_BIRTH_(?:TIMEOUT|TUPLE_MISMATCH|PROCESS_IDENTITY_FAILED|STATE_CHANGED)$'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw 'checkout HEAD does not match GITHUB_SHA'
          }
          if (git status --porcelain=v1) {
            throw 'checkout is not clean'
          }
          $branch = "candidate/f005-t070-$env:GITHUB_SHA"
          $existing = @(git ls-remote --heads origin "refs/heads/$branch")
          if ($LASTEXITCODE -ne 0) {
            throw "candidate branch existence check failed: $LASTEXITCODE"
          }
          if ($existing.Count -ne 0) {
            throw "candidate branch already exists: $branch"
          }

      - name: Preflight workspace disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driveName = [IO.Path]::GetPathRoot($PWD.Path).TrimEnd('\').TrimEnd(':')
          $drive = Get-PSDrive -Name $driveName
          if ($drive.Free -lt 10GB) {
            throw "production開始前の空き容量が10GiB未満です: $($drive.Free)"
          }

      - name: Set up fixed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify pinned native guard
        id: native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $PWD 'native\f005-guard\build-evidence.json'
          $expectedBytes = [IO.File]::ReadAllBytes($evidencePath)
          $expectedRaw = [Text.Encoding]::UTF8.GetString($expectedBytes)
          $expectedObject = $expectedRaw | ConvertFrom-Json
          $expectedSemantic = $expectedObject | ConvertTo-Json -Depth 20 -Compress
          & pwsh -NoLogo -NoProfile -File native/f005-guard/build.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "native guard build failed: $LASTEXITCODE"
          }
          $actualRaw = Get-Content -LiteralPath $evidencePath -Raw
          $actualObject = $actualRaw | ConvertFrom-Json
          $actualSemantic = $actualObject | ConvertTo-Json -Depth 20 -Compress
          if ($actualSemantic -cne $expectedSemantic) {
            $names = @(
              $expectedObject.PSObject.Properties.Name
              $actualObject.PSObject.Properties.Name
            ) | Sort-Object -Unique
            $drift = @($names | Where-Object {
              $expectedValue = ConvertTo-Json `
                -InputObject $expectedObject.$_ -Depth 20 -Compress
              $actualValue = ConvertTo-Json `
                -InputObject $actualObject.$_ -Depth 20 -Compress
              $expectedValue -cne $actualValue
            })
            $encodedDrift = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes($drift -join ',')
            )
            Write-Host "F005_NATIVE_EVIDENCE_DRIFT_FIELDS_BASE64=$encodedDrift"
            throw 'native build evidence semantic drift'
          }
          [IO.File]::WriteAllBytes($evidencePath, $expectedBytes)
          $workspaceRoot = [IO.Path]::GetFullPath($PWD.Path).TrimEnd('\')
          $externalRoot = [IO.Path]::GetFullPath((
            Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP)) (
              "f005-native-hosted-$([Guid]::NewGuid().ToString('N'))"
            )
          )).TrimEnd('\')
          if ($externalRoot.Equals(
            $workspaceRoot,
            [StringComparison]::OrdinalIgnoreCase
          ) -or $externalRoot.StartsWith(
            "$workspaceRoot\",
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'native guard runtime must stay outside the guarded workspace'
          }
          $createdRoot = New-Item -ItemType Directory -Path $externalRoot
          if (($createdRoot.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'external native guard root must not be a reparse point'
          }
          $sourceGuard = Join-Path $PWD '.cache\dotnet-f005\publish\f005-guard.exe'
          $externalGuard = Join-Path $externalRoot 'f005-guard.exe'
          Copy-Item -LiteralPath $sourceGuard -Destination $externalGuard
          $externalInfo = Get-Item -LiteralPath $externalGuard
          if (($externalInfo.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'external native guard file must not be a reparse point'
          }
          $externalSha256 = (
            Get-FileHash -LiteralPath $externalGuard -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($externalSha256 -ne $expectedObject.outputBinarySha256) {
            throw 'external native guard SHA-256 mismatch'
          }
          "guard_path=$externalGuard" >> $env:GITHUB_OUTPUT

      - name: Verify prepared source remains clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-CapturedGit([string[]] $Arguments) {
            $stdoutPath = [IO.Path]::GetTempFileName()
            $stderrPath = [IO.Path]::GetTempFileName()
            try {
              $process = Start-Process `
                -FilePath (Get-Command git).Source `
                -ArgumentList $Arguments `
                -WorkingDirectory $PWD `
                -NoNewWindow `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -Wait `
                -PassThru
              $stdout = Get-Content -LiteralPath $stdoutPath -Raw
              if ($process.ExitCode -ne 0) {
                throw "Git preflight command failed: $($process.ExitCode)"
              }
              return $stdout
            } finally {
              Remove-Item -LiteralPath $stdoutPath, $stderrPath `
                -Force -ErrorAction SilentlyContinue
            }
          }
          $head = (Invoke-CapturedGit @('rev-parse', 'HEAD')).Trim()
          $symbolic = (Invoke-CapturedGit @('symbolic-ref', '-q', 'HEAD')).Trim()
          $statusRaw = Invoke-CapturedGit @(
            'status',
            '--porcelain=v1',
            '--untracked-files=all'
          )
          $status = @($statusRaw -split '\r?\n' | Where-Object { $_ })
          if ($head -ne $env:GITHUB_SHA -or
            -not $symbolic.StartsWith('refs/heads/') -or
            $status.Count -ne 0) {
            $encodedStatus = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes($status -join "`n")
            )
            Write-Host "F005_PREFLIGHT_STATUS_BASE64=$encodedStatus"
            throw 'prepared source is not a clean branch at GITHUB_SHA'
          }

      - name: Download and verify fixed VOICEVOX ENGINE
        id: engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $assetName = 'voicevox_engine-windows-cpu-0.25.2.7z.001'
          $assetUrl =
            "https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/$assetName"
          $expectedSha256 =
            '2ab86e4bf29448e3317ee97327efb3211c4ecc1063b03a62ab72b15a92ec531d'
          $workspaceRoot = [IO.Path]::GetFullPath($PWD.Path).TrimEnd('\')
          $cacheRoot = [IO.Path]::GetFullPath((
            Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP)) `
              'f005-voicevox-hosted'
          )).TrimEnd('\')
          if ($cacheRoot.Equals(
            $workspaceRoot,
            [StringComparison]::OrdinalIgnoreCase
          ) -or $cacheRoot.StartsWith(
            "$workspaceRoot\",
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'VOICEVOX cache must stay outside the guarded workspace'
          }
          $archive = Join-Path $cacheRoot $assetName
          $engineRoot = Join-Path $cacheRoot 'engine'
          $driveName = [IO.Path]::GetPathRoot($cacheRoot).TrimEnd('\').TrimEnd(':')
          $drive = Get-PSDrive -Name $driveName
          if ($drive.Free -lt 10GB) {
            throw "VOICEVOX取得前の空き容量が10GiB未満です: $($drive.Free)"
          }
          New-Item -ItemType Directory -Force -Path $cacheRoot, $engineRoot | Out-Null
          $downloaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              if (Test-Path -LiteralPath $archive) {
                Remove-Item -LiteralPath $archive -Force
              }
              Invoke-WebRequest -Uri $assetUrl -OutFile $archive -ErrorAction Stop
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds ([math]::Min(30, 5 * $attempt))
            }
          }
          if (-not $downloaded) {
            throw 'VOICEVOX asset download failed after retries'
          }
          $actualSha256 =
            (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "VOICEVOX asset SHA-256 mismatch: $actualSha256"
          }
          & 7z x $archive "-o$engineRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "VOICEVOX asset extraction failed: $LASTEXITCODE"
          }
          Remove-Item -LiteralPath $archive -Force
          $drive = Get-PSDrive -Name $driveName
          if ($drive.Free -lt 5GB) {
            throw "VOICEVOX展開後の空き容量が5GiB未満です: $($drive.Free)"
          }
          $executables = @(Get-ChildItem -LiteralPath $engineRoot -Recurse -Filter run.exe -File)
          if ($executables.Count -ne 1) {
            throw "VOICEVOX run.exe must be unique: $($executables.Count)"
          }
          "run_path=$($executables[0].FullName)" >> $env:GITHUB_OUTPUT
          "asset_sha256=$actualSha256" >> $env:GITHUB_OUTPUT
          "cache_root=$cacheRoot" >> $env:GITHUB_OUTPUT

      - name: Run T-070 production pipeline
        id: production
        continue-on-error: true
        shell: pwsh
        env:
          VOICEVOX_URL: http://127.0.0.1:50021/
          NO_PROXY: 127.0.0.1,localhost
          F005_ENGINE_CACHE_ROOT: ${{ steps.engine.outputs.cache_root }}
          F005_NATIVE_GUARD_PATH: ${{ steps.native.outputs.guard_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-BoundedBase64Diagnostic(
            [string] $Name,
            [string] $Value
          ) {
            $limit = 65536
            if ($Value.Length -gt $limit) {
              $Value = $Value.Substring($Value.Length - $limit)
            }
            $encoded = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes($Value)
            )
            Write-Host "$Name=$encoded"
          }
          function Write-SafeFailureAnnotation(
            [string] $Stderr,
            [string] $DiagnosticPath
          ) {
            function Test-SafeFailureCode([object] $Value) {
              if ($Value -isnot [string] -or
                $Value -notmatch '^[A-Z][A-Z0-9_]{0,127}$') {
                return $false
              }
              if ($Value.StartsWith(
                'F005_ETW_WRITE_COMPLETION_DRAIN_',
                [StringComparison]::Ordinal
              )) {
                return $Value -cmatch `
                  $env:F005_WRITE_COMPLETION_DRAIN_FAILURE_PATTERN
              }
              return $true
            }
            $lines = @($Stderr -split '\r?\n')
            $summary = @(
              $lines |
                Where-Object {
                  $_ -match (
                    '^F005_(?:PROGRESS|VOICE_PROGRESS|HOST_PROGRESS)=' +
                    '[a-z0-9-]+$'
                  )
                } |
                Select-Object -Last 2
            )
            $nativeFailure = @(
              $lines |
                Where-Object {
                  $_ -match '^F005_NATIVE_START_FAILURE=[A-Z0-9_]+$'
                } |
                Select-Object -Last 1
            )
            $summary += $nativeFailure
            $failurePrefix = 'F005_FAILURE_JSON='
            $failureLine = @(
              $lines |
                Where-Object { $_.StartsWith($failurePrefix) } |
                Select-Object -Last 1
            )
            if ($failureLine.Count -eq 1) {
              try {
                $failure = $failureLine[0].Substring(
                  $failurePrefix.Length
                ) | ConvertFrom-Json
                if ($failure.name -match '^[A-Za-z][A-Za-z0-9]{0,63}$') {
                  $summary += "failureName=$($failure.name)"
                }
                if (Test-SafeFailureCode $failure.code) {
                  $summary += "failureCode=$($failure.code)"
                }
                if ($failure.cause.name -match '^[A-Za-z][A-Za-z0-9]{0,63}$') {
                  $summary += "causeName=$($failure.cause.name)"
                }
                if (Test-SafeFailureCode $failure.cause.code) {
                  $summary += "causeCode=$($failure.cause.code)"
                }
              } catch {
                # 自由文やparse errorはannotationへ出さない。
              }
            }
            if ($summary.Count -eq 0) {
              $summary = @('fixedDiagnostic=unavailable')
            }
            $safeSummary = $summary -join ' '
            [IO.File]::WriteAllText(
              $DiagnosticPath,
              "$safeSummary`n",
              [Text.UTF8Encoding]::new($false)
            )
          }
          $runPath = '${{ steps.engine.outputs.run_path }}'
          $logRoot = [IO.Path]::GetFullPath($env:F005_ENGINE_CACHE_ROOT)
          $resultPath = Join-Path $logRoot 'f005-hosted-production-result.json'
          $stdoutPath = Join-Path $logRoot 'f005-hosted-production.stdout.log'
          $stderrPath = Join-Path $logRoot 'f005-hosted-production.stderr.log'
          $diagnosticPath = Join-Path $logRoot 'f005-safe-diagnostic.txt'
          $entryProbeStdoutPath = Join-Path $logRoot 'f005-entry-probe.stdout.log'
          $entryProbeStderrPath = Join-Path $logRoot 'f005-entry-probe.stderr.log'
          $engineProcess = $null
          $stderr = ''
          $hostProgress = 'initializing'
          try {
          $hostProgress = 'runner-entry-probe'
          $entryProbe = Start-Process `
            -FilePath (Get-Command node).Source `
            -ArgumentList @(
              '--experimental-transform-types',
              'scripts/f005-run-work.ts',
              '--work',
              '__invalid__'
            ) `
            -WorkingDirectory $PWD `
            -NoNewWindow `
            -RedirectStandardOutput $entryProbeStdoutPath `
            -RedirectStandardError $entryProbeStderrPath `
            -Wait `
            -PassThru
          if ($entryProbe.ExitCode -eq 0) {
            $hostProgress = 'runner-entry-probe-zero'
            throw 'F005 runner entry probe unexpectedly returned zero'
          }
          $hostProgress = 'engine-start'
          $engineProcess = Start-Process `
            -FilePath $runPath `
            -ArgumentList '--host', '127.0.0.1', '--port', '50021' `
            -WorkingDirectory (Split-Path -Parent $runPath) `
            -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $logRoot 'engine.stdout.log') `
            -RedirectStandardError (Join-Path $logRoot 'engine.stderr.log') `
            -PassThru
          $hostProgress = 'engine-probe'
          $version = $null
          $probeDeadlineSeconds = 120
          $probeTimer = [Diagnostics.Stopwatch]::StartNew()
          while ($probeTimer.Elapsed.TotalSeconds -lt $probeDeadlineSeconds) {
            if ($engineProcess.HasExited) {
              throw "VOICEVOX ENGINE exited early: $($engineProcess.ExitCode)"
            }
            try {
              $version = Invoke-RestMethod `
                -Uri 'http://127.0.0.1:50021/version' `
                -ConnectionTimeoutSeconds 2 `
                -OperationTimeoutSeconds 2
              break
            } catch {
              if ($probeTimer.Elapsed.TotalSeconds -lt $probeDeadlineSeconds) {
                Start-Sleep -Seconds 1
              }
            }
          }
          if ($version -ne '0.25.2') {
            throw "VOICEVOX ENGINE version mismatch: $version"
          }
          $hostProgress = 'runner-start'
          $runnerProcess = Start-Process `
            -FilePath (Get-Command node).Source `
            -ArgumentList @(
              '--experimental-transform-types',
              'scripts/f005-run-work.ts',
              '--work',
              '000799'
            ) `
            -WorkingDirectory $PWD `
            -NoNewWindow `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -Wait `
            -PassThru
          $hostProgress = 'runner-finished'
          $runnerExitCode = $runnerProcess.ExitCode
          $raw = if (Test-Path -LiteralPath $stdoutPath) {
            @(Get-Content -LiteralPath $stdoutPath)
          } else {
            @()
          }
          $stderr = if (Test-Path -LiteralPath $stderrPath) {
            Get-Content -LiteralPath $stderrPath -Raw
          } else {
            ''
          }
          if ($runnerExitCode -ne 0) {
            Write-SafeFailureAnnotation $stderr $diagnosticPath
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDOUT_BASE64' ($raw -join "`n")
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDERR_BASE64' $stderr
            throw "F005 production runner failed: $runnerExitCode"
          }
          $hostProgress = 'result-marker-check'
          $prefix = 'F005_RESULT_JSON='
          $resultLines = @($raw | Where-Object { $_.StartsWith($prefix) })
          if ($resultLines.Count -ne 1) {
            $hostProgress = if ($resultLines.Count -eq 0) {
              'result-marker-missing'
            } else {
              'result-marker-duplicate'
            }
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDOUT_BASE64' ($raw -join "`n")
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDERR_BASE64' $stderr
            throw "F005 production runner result marker count is $($resultLines.Count)"
          }
          $hostProgress = 'result-json-parse'
          $result = $resultLines[0].Substring($prefix.Length) | ConvertFrom-Json
          $hostProgress = 'result-validation'
          if ($result.ok -ne $true -or $result.workId -ne '000799' -or
            $result.status -ne 'accepted') {
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDOUT_BASE64' ($raw -join "`n")
            Write-BoundedBase64Diagnostic `
              'F005_RUNNER_STDERR_BASE64' $stderr
            throw 'F005 production runner result is not accepted'
          }
          $hostProgress = 'result-write'
          $json = ($result | ConvertTo-Json -Depth 20) + "`n"
          [IO.File]::WriteAllText(
            $resultPath,
            $json.Replace("`r`n", "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          } catch {
            if (-not (Test-Path -LiteralPath $diagnosticPath -PathType Leaf)) {
              Write-SafeFailureAnnotation (
                "$stderr`nF005_HOST_PROGRESS=$hostProgress"
              ) $diagnosticPath
            }
            throw
          } finally {
            if ($null -ne $engineProcess -and -not $engineProcess.HasExited) {
              Stop-Process -Id $engineProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish safe production diagnostic
        if: steps.production.outcome == 'failure'
        shell: pwsh
        env:
          F005_ENGINE_CACHE_ROOT: ${{ steps.engine.outputs.cache_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logRoot = [IO.Path]::GetFullPath($env:F005_ENGINE_CACHE_ROOT)
          $diagnosticPath = Join-Path $logRoot 'f005-safe-diagnostic.txt'
          $diagnostic = if (
            Test-Path -LiteralPath $diagnosticPath -PathType Leaf
          ) {
            (Get-Content -LiteralPath $diagnosticPath -Raw).Trim()
          } else {
            'fixedDiagnostic=unavailable'
          }
          $token = (
            '(?:F005_(?:PROGRESS|VOICE_PROGRESS|HOST_PROGRESS)=[a-z0-9-]+|' +
            'F005_NATIVE_START_FAILURE=[A-Z0-9_]+|' +
            '(?:failureName|causeName)=[A-Za-z][A-Za-z0-9]{0,63}|' +
            '(?:failureCode|causeCode)=[A-Z][A-Z0-9_]{0,127}|' +
            'fixedDiagnostic=unavailable)'
          )
          if ($diagnostic -notmatch "^$token(?: $token)*$") {
            $diagnostic = 'fixedDiagnostic=unavailable'
          }
          foreach ($item in @($diagnostic -split ' ')) {
            if ($item -match '^(?:failureCode|causeCode)=(.+)$') {
              $code = $Matches[1]
              if ($code.StartsWith(
                  'F005_ETW_WRITE_COMPLETION_DRAIN_',
                  [StringComparison]::Ordinal
                ) -and $code -cnotmatch `
                  $env:F005_WRITE_COMPLETION_DRAIN_FAILURE_PATTERN) {
                $diagnostic = 'fixedDiagnostic=unavailable'
                break
              }
              if ($code.StartsWith(
                  'F005_WRITE_LEASE_PRODUCER_BIRTH_',
                  [StringComparison]::Ordinal
                ) -and $code -cnotmatch `
                  $env:F005_WRITE_LEASE_PRODUCER_BIRTH_FAILURE_PATTERN) {
                $diagnostic = 'fixedDiagnostic=unavailable'
                break
              }
            }
          }
          $annotation = $diagnostic.Replace('%', '%25').
            Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output (
            '::error file=.github/workflows/f005-hosted-production.yml,' +
            "line=1,col=1,title=F005 production diagnostic::$annotation"
          )
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
              "### F005 production diagnostic`n`n$annotation"
            )
          }

      - name: Fail closed after production diagnostic
        if: steps.production.outcome == 'failure'
        shell: pwsh
        run: |
          throw 'F005 production pipeline failed safely'

      - name: Validate and persist isolated candidate
        shell: pwsh
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
          F005_ENGINE_CACHE_ROOT: ${{ steps.engine.outputs.cache_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- public
          $manifest = Get-Content -LiteralPath 'content\batches\F005\batch.json' -Raw |
            ConvertFrom-Json
          $work = @($manifest.workProgress | Where-Object { $_.workId -eq '000799' })
          if ($work.Count -ne 1 -or $work[0].status -ne 'accepted' -or
            @($work[0].acceptedAudioSources).Count -ne 62) {
            throw 'accepted manifest tuple is incomplete'
          }
          $audio = @(Get-ChildItem `
            -LiteralPath 'content\batches\F005\accepted-audio\000799' `
            -Filter '*.wav' -File)
          if ($audio.Count -ne 62) {
            throw "accepted WAV count mismatch: $($audio.Count)"
          }
          $changed = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique
          $allowed = @(
            '^content/batches/F005/batch\.json$',
            '^content/batches/F005/accepted-audio/000799/[0-9a-f]{64}\.wav$',
            '^content/batches/F005/work-artifacts/000799/runs/[0-9a-f]{64}/[-a-z]+\.json$',
            '^content/batches/F005/capacity-actual/000799/[0-9a-f]{64}\.json$'
          )
          foreach ($path in $changed) {
            if (-not ($allowed | Where-Object { $path -match $_ })) {
              throw "production changed an allowlist-external path: $path"
            }
          }
          if (git diff --diff-filter=D --name-only) {
            throw 'production deleted a tracked file'
          }
          $logRoot = [IO.Path]::GetFullPath($env:F005_ENGINE_CACHE_ROOT)
          $resultPath = Join-Path $logRoot 'f005-hosted-production-result.json'
          $runnerResult = Get-Content -LiteralPath $resultPath -Raw |
            ConvertFrom-Json
          $nativeEvidence = Get-Content `
            -LiteralPath 'native\f005-guard\build-evidence.json' -Raw |
            ConvertFrom-Json
          $evidence = [ordered]@{
            schemaVersion = '1.0.0'
            kind = 'f005-hosted-production-candidate'
            sourceCommit = $env:GITHUB_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            runnerOs = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            voicevoxVersion = '0.25.2'
            voicevoxAssetSha256 = '${{ steps.engine.outputs.asset_sha256 }}'
            nativeBinarySha256 = $nativeEvidence.outputBinarySha256
            workId = '000799'
            acceptedWavCount = $audio.Count
            result = $runnerResult
            changedPaths = $changed
          }
          $evidencePath =
            'docs\evidence\implementation\F005-hosted-production-candidate.json'
          $json = ($evidence | ConvertTo-Json -Depth 30) + "`n"
          [IO.File]::WriteAllText(
            (Join-Path $PWD $evidencePath),
            $json.Replace("`r`n", "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          git add -- `
            content/batches/F005/batch.json `
            content/batches/F005/accepted-audio/000799 `
            content/batches/F005/work-artifacts/000799/runs `
            content/batches/F005/capacity-actual/000799 `
            $evidencePath
          $remaining = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ }
          if ($remaining) {
            throw 'unstaged production output remains'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(f005): accept hosted production work 000799'
          $branch = "candidate/f005-t070-$env:GITHUB_SHA"
          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_PUSH_TOKEN")
          )
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" `
            push origin "HEAD:refs/heads/$branch"
